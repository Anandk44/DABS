# This is a Declarative Automation Bundle definition for dab_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_demo
  uuid: 7d0e5714-43a9-4ff2-92eb-3ca4cbe8a120

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    presets:
      name_prefix: dev_
    default: true
    workspace:
      host: https://dbc-8d29592a-8e37.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    presets:
      name_prefix: prod_
    workspace:
      host: https://dbc-8d29592a-8e37.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/anandkoyalmudi1000@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/anandkoyalmudi1000@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: anandkoyalmudi1000@gmail.com
        level: CAN_MANAGE
